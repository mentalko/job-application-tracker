<!doctype html>
<!--
  One frame of the README's demo GIF. make_demo_gif.py renders it with headless Chrome as
  scene.html?a=<scene>&b=<next scene>&p=<0..1 progress of the slide from a to b>.
  The scenes are the screenshots in docs/screenshots (fictional demo data only).
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    font-family: "Inter Display", Inter, sans-serif;
    background:
      radial-gradient(900px 520px at 88% 115%, rgba(116, 143, 252, 0.45), transparent 60%),
      linear-gradient(135deg, #1b2559 0%, #2d3a8c 55%, #4c6ef5 125%);
    color: #fff;
    position: relative;
  }
  .layer { position: absolute; inset: 0; will-change: transform, opacity; }
  .caption { position: absolute; left: 56px; top: 30px; right: 300px; }
  .caption h2 { font-size: 36px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.1; }
  .caption p { font-family: Inter, sans-serif; font-size: 18px; color: #dbe4ff; margin-top: 8px; font-weight: 500; }
  .frame {
    position: absolute; left: 50px; top: 132px; width: 1180px; height: 640px;
    border-radius: 14px; overflow: hidden; background: #fff;
    box-shadow: 0 26px 70px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.25);
  }
  .bar { height: 28px; background: #eef1f6; display: flex; align-items: center; gap: 7px; padding-left: 14px; }
  .bar i { width: 11px; height: 11px; border-radius: 50%; display: block; }
  .view { position: relative; width: 1180px; height: 612px; overflow: hidden; }
  .view img { position: absolute; transform-origin: 0 0; }
  .brand { position: absolute; right: 56px; top: 36px; display: flex; align-items: center; gap: 10px;
    font-family: Inter, sans-serif; font-size: 16px; font-weight: 600; color: #dbe4ff; }
  .logo { width: 34px; height: 34px; border-radius: 9px; background: #4c6ef5; display: grid; place-items: center;
    box-shadow: 0 6px 16px rgba(0,0,0,0.25); }
  .dots { position: absolute; right: 56px; top: 84px; display: flex; gap: 7px; }
  .dots b { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.3); display: block; }
  .dots b.on { background: #fff; width: 22px; border-radius: 4px; }
  /* The intro: like the social preview card. */
  .intro .left { position: absolute; left: 64px; top: 92px; width: 560px; }
  .intro h1 { font-size: 64px; line-height: 1.02; font-weight: 800; letter-spacing: -1.6px; margin-top: 30px; }
  .intro .tag { font-size: 25px; line-height: 1.35; color: #dbe4ff; margin-top: 22px; font-weight: 450; }
  .intro .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
  .intro .chip { font-family: Inter, sans-serif; font-size: 17px; font-weight: 600; padding: 8px 14px;
    border-radius: 999px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.22); }
  .intro .shot { position: absolute; left: 680px; top: 110px; width: 800px; height: 660px; border-radius: 14px;
    overflow: hidden; background: #fff; box-shadow: 0 30px 80px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.25);
    transform: perspective(1600px) rotateY(-9deg) rotateX(3deg); transform-origin: left center; }
  .intro .shot img { display: block; width: 1040px; margin-left: -8px; }
</style>
</head>
<body>
<script>
  const S = "../../docs/screenshots/";
  // Each scene: a caption, and which part of which screenshot to show (x, y, width in the
  // screenshot's pixels; it's scaled to fill the frame's width). Keep each entry starting
  // "{ intro" or "{ title" on its own line: make_demo_gif.py counts them that way.
  const SCENES = [
    { intro: true },
    { title: "Know what to chase next", sub: "Replies to read, your to-dos, follow-ups and who's gone quiet, in one list",
      img: "next-actions.png", x: 236, y: 56, w: 1020 },
    { title: "Every application on a Kanban board", sub: "Drag between any stages; every move is timestamped, and undo is one click",
      img: "board.png", x: 232, y: 56, w: 1268 },
    { title: "Recruiters, their calls and the roles they pitch", sub: "Book or log a call, then apply for or pass on each role",
      img: "person.png", x: 232, y: 56, w: 1168 },
    { title: "A page for every role", sub: "Pay, terms, who pitched it, your to-dos and the job description",
      img: "role.png", x: 232, y: 56, w: 1168 },
    { title: "Compare offers side by side", sub: "Salary, bonus, equity and pension, or day rate, and what each is worth a year",
      img: "offers.png", x: 232, y: 56, w: 1168 },
    { title: "See your funnel", sub: "A Sankey diagram from applied to offer, filtered by date and route",
      img: "insights.png", x: 232, y: 56, w: 1168 },
    { title: "One timeline across everything", sub: "Every message, call, interview and offer, by day or as lanes",
      img: "timeline.png", x: 232, y: 56, w: 1168 },
    { title: "Find anything", sub: "Applications, people, notes, debriefs, emails and links: press /",
      img: "search.png", x: 232, y: 56, w: 1168 },
  ];
  const LOGO = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round">
    <circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg>`;

  function intro() {
    return `<div class="intro">
      <div class="left">
        <div style="display:flex;align-items:center;gap:16px">
          <div class="logo" style="width:64px;height:64px;border-radius:16px">${LOGO.replace(/20/g, "40")}</div>
          <div style="font-family:Inter,sans-serif;font-size:20px;font-weight:600;color:#dbe4ff">Open source · Self-hosted · Local-first</div>
        </div>
        <h1>Job Application<br/>Tracker</h1>
        <p class="tag">Every application, recruiter, interview and offer in one place, with what to chase next.</p>
        <div class="chips">
          <span class="chip">Kanban board</span><span class="chip">Recruiter CRM</span>
          <span class="chip">Today</span><span class="chip">Offer comparison</span>
        </div>
      </div>
      <div class="shot"><div class="bar"><i style="background:#ff6b6b"></i><i style="background:#fcc419"></i><i style="background:#51cf66"></i></div>
        <img src="${S}overview.png" /></div>
    </div>`;
  }

  const BAR = `<div class="bar"><i style="background:#ff6b6b"></i><i style="background:#fcc419"></i><i style="background:#51cf66"></i></div>`;

  // A feature scene in parts, so a slide can move them differently.
  function caption(i) {
    const s = SCENES[i];
    return `<div class="caption"><h2>${s.title}</h2><p>${s.sub}</p></div>`;
  }
  function frame(i) {
    const s = SCENES[i];
    const scale = 1180 / s.w;
    return `<div class="frame">${BAR}<div class="view"><img src="${S}${s.img}"
      style="left:${-s.x * scale}px;top:${-s.y * scale}px;transform:scale(${scale})" /></div></div>`;
  }
  function chrome(i) {
    const dots = SCENES.slice(1).map((_, k) => `<b class="${k + 1 === i ? "on" : ""}"></b>`).join("");
    return `<div class="brand"><div class="logo">${LOGO}</div>Job Application Tracker</div><div class="dots">${dots}</div>`;
  }

  function add(html, transform = "", opacity = 1) {
    const el = document.createElement("div");
    el.className = "layer";
    el.innerHTML = html;
    el.style.transform = transform;
    el.style.opacity = String(opacity);
    document.body.appendChild(el);
  }

  const q = new URLSearchParams(location.search);
  const a = Number(q.get("a") ?? 0);
  const b = q.has("b") ? Number(q.get("b")) : null;
  const p = Number(q.get("p") ?? 0);
  // Ease in and out, so the slide starts and lands gently.
  const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;

  if (b === null) {
    // A still: the intro, or a feature with its caption, logo and progress dots.
    if (SCENES[a].intro) add(intro());
    else add(chrome(a) + caption(a) + frame(a));
  } else if (SCENES[a].intro || SCENES[b].intro) {
    // Into or out of the intro: the whole picture slides.
    const one = (i) => (SCENES[i].intro ? intro() : chrome(i) + caption(i) + frame(i));
    add(one(a), `translateX(${-e * 100}%)`);
    add(one(b), `translateX(${(1 - e) * 100}%)`);
  } else {
    // Between features: the screens slide past each other; the caption swaps halfway.
    add(chrome(e < 0.5 ? a : b));
    add(caption(a), `translateY(${-e * 12}px)`, Math.max(0, 1 - e * 2));
    add(caption(b), `translateY(${(1 - e) * 12}px)`, Math.max(0, e * 2 - 1));
    add(frame(a), `translateX(${-e * 105}%)`);
    add(frame(b), `translateX(${(1 - e) * 105}%)`);
  }
</script>
</body>
</html>
