# Builds the website (website/) and publishes it to GitHub Pages:
# https://waddington.github.io/job-application-tracker/
# Needs Settings → Pages → Source: "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/guide/**"
      - "docs/screenshots/**"
      - "docs/social-preview.png"
      - "frontend/public/**"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "llms.txt"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - "docs/guide/**"
      - "docs/screenshots/**"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "llms.txt"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a deploy that's under way; superseded pull request builds can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm --dir website install --frozen-lockfile
      - run: pnpm --dir website build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
